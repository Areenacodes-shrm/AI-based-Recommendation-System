# PathPilot AI Application Properties
server.port=${PORT:8080}

# Database Configuration with MySQL 8.0 support and H2 MySQL-mode fallback
# Overridable via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER
spring.datasource.url=${DB_URL:jdbc:h2:mem:pathpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Idempotent SQL schema initialization (non-destructive CREATE TABLE IF NOT EXISTS)
# Seed data is loaded idempotently by SeedDataInitializer only when missing
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
pathpilot.seed.enabled=${SEED_DATA_ENABLED:true}

# Secure HttpSession & Cookie defaults
server.servlet.session.cookie.name=PATHPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m

# CORS allowed origins
pathpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}

# Concurrency & Recommendation Engine Properties
pathpilot.recommendation.thread-pool-size=${PATHPILOT_THREAD_POOL_SIZE:8}
pathpilot.recommendation.timeout-ms=${PATHPILOT_TIMEOUT_MS:2500}
pathpilot.recommendation.default-candidate-limit=30

# Logging (never log credentials, passwords, or session tokens)
logging.level.com.pathpilot=INFO
logging.level.org.springframework.jdbc=INFO
