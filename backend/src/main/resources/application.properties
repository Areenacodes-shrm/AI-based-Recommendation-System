# PathPilot AI Application Properties
server.port=8080

# Database Configuration with MySQL 8.0 support and H2 MySQL-mode fallback
# Overridable via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER
spring.datasource.url=${DB_URL:jdbc:h2:mem:pathpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Automatic SQL Schema and Seed initialization using explicit SQL scripts
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Concurrency & Recommendation Engine Properties
pathpilot.recommendation.thread-pool-size=8
pathpilot.recommendation.timeout-ms=2500
pathpilot.recommendation.default-candidate-limit=30

# Logging
logging.level.com.pathpilot=INFO
logging.level.org.springframework.jdbc=INFO
